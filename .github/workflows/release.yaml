name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Standard releases (v1.0.0, v0.1.2, etc)
      - '!v0.0.*'  # Exclude test tags

# Grant permissions needed by all jobs including reusable workflows
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  pull-requests: write

# Prevent concurrent gh-pages deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Validate tag format
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag
        id: parse
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          echo "✓ Version format valid: $VERSION"

  # Run all tests (unit + E2E) using reusable workflow
  tests:
    needs: validate
    uses: ./.github/workflows/reusable-tests.yaml
    with:
      run-unit: true
      run-e2e: true

  # Build and push images using reusable workflow
  build-images:
    needs: [validate, tests]
    uses: ./.github/workflows/reusable-build-images.yaml
    with:
      version: ${{ needs.validate.outputs.version }}
      push-latest: true
      artifact-prefix: 'release-'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Package Helm chart
  build-helm:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package chart
        run: |
          VERSION=${{ needs.validate.outputs.version }}

          # Update image tags in values.yaml to match release version
          sed -i "s|^\(\s*tag:\s*\)[0-9]*\.[0-9]*\.[0-9]*[^\"]*|\1$VERSION|" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-agent:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-agent:$VERSION|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-server:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-server:$VERSION|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-python-string:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-python-string:$VERSION|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-pctx-codemode:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-pctx-codemode:$VERSION|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-fastmcp-codemode:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-fastmcp-codemode:$VERSION|g" operator/chart/values.yaml

          echo "Updated chart image tags to $VERSION:"
          grep -E "tag:|kaos-(agent|mcp)" operator/chart/values.yaml

          mkdir -p ./charts
          helm package operator/chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            -d ./charts
          echo "Packaged chart: kaos-operator-${VERSION}.tgz"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./charts/*.tgz
          if-no-files-found: error

  # Publish kaos-cli to PyPI
  publish-python:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kaos-cli/
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if version already published
        id: check-pypi
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          if curl -s "https://pypi.org/pypi/kaos-cli/${VERSION}/json" | grep -q '"version"'; then
            echo "Version $VERSION already exists on PyPI, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on PyPI, will publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check-pypi.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        if: steps.check-pypi.outputs.skip != 'true'
        run: python -m pip install --upgrade pip build

      - name: Update version and build kaos-cli
        if: steps.check-pypi.outputs.skip != 'true'
        working-directory: kaos-cli
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          # Copy sample YAMLs from operator into package data
          cp ../operator/config/samples/[0-9]*.yaml kaos_cli/samples/data/
          # Guardrail: fail if no samples were copied
          SAMPLE_COUNT=$(ls kaos_cli/samples/data/*.yaml 2>/dev/null | wc -l)
          if [ "$SAMPLE_COUNT" -eq 0 ]; then
            echo "ERROR: No sample YAML files found in kaos_cli/samples/data/"
            exit 1
          fi
          echo "Bundled $SAMPLE_COUNT sample files"
          python -m build

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: kaos-cli/dist/

  # Build and deploy versioned documentation using reusable workflow
  publish-docs:
    needs: validate
    uses: ./.github/workflows/reusable-docs.yaml
    with:
      version: ${{ needs.validate.outputs.version }}
      base-path: /kaos/v${{ needs.validate.outputs.version }}/
      deploy-path: v${{ needs.validate.outputs.version }}
      update-latest: true
      package-helm: true
      helm-version: ${{ needs.validate.outputs.version }}

  # Create GitHub Release
  create-release:
    needs: [validate, build-images, build-helm, publish-docs]
    if: always() && needs.validate.result == 'success' && needs.build-images.result == 'success' && needs.build-helm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: ./charts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: |
            ./charts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish pydantic-ai-server to PyPI
  publish-pydantic-ai-server:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pydantic-ai-server/
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if version already published
        id: check-pypi
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          if curl -s "https://pypi.org/pypi/pydantic-ai-server/${VERSION}/json" | grep -q '"version"'; then
            echo "Version $VERSION already exists on PyPI, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on PyPI, will publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check-pypi.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        if: steps.check-pypi.outputs.skip != 'true'
        run: python -m pip install --upgrade pip build

      - name: Update version and build pydantic-ai-server
        if: steps.check-pypi.outputs.skip != 'true'
        working-directory: pydantic-ai-server
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          python -m build

      - name: Publish to PyPI
        if: steps.check-pypi.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pydantic-ai-server/dist/

  # Create releases on standalone repos (idempotent — skips if release exists)
  release-standalone-repos:
    needs: [validate, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Create release on pydantic-ai-server repo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          REPO="axsaucedo/pydantic-ai-server"
          if gh release view "v${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists on ${REPO}, skipping"
          else
            gh release create "v${VERSION}" --repo "${REPO}" \
              --title "v${VERSION}" \
              --notes "Release v${VERSION} — synced from [KAOS monorepo](https://github.com/axsaucedo/agentic-kubernetes-operator/releases/tag/v${VERSION})" \
              --latest
            echo "Created release v${VERSION} on ${REPO}"
          fi

      - name: Create release on kaos-ui repo
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          REPO="axsaucedo/kaos-ui"
          if gh release view "v${VERSION}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists on ${REPO}, skipping"
          else
            gh release create "v${VERSION}" --repo "${REPO}" \
              --title "v${VERSION}" \
              --notes "Release v${VERSION} — synced from [KAOS monorepo](https://github.com/axsaucedo/agentic-kubernetes-operator/releases/tag/v${VERSION})" \
              --latest
            echo "Created release v${VERSION} on ${REPO}"
          fi

  # Deploy kaos-ui to gh-pages (versioned + latest)
  deploy-ui:
    needs: [validate]
    uses: ./.github/workflows/deploy-kaos-ui.yaml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit

  # Bump version on main after release
  bump-version:
    needs: [validate, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate next dev version
        id: next
        run: |
          VERSION=${{ needs.validate.outputs.version }}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_DEV="${MAJOR}.${MINOR}.${NEXT_PATCH}-dev"
          PYTHON_DEV="${MAJOR}.${MINOR}.${NEXT_PATCH}.dev0"
          echo "next_dev=$NEXT_DEV" >> $GITHUB_OUTPUT
          echo "python_dev=$PYTHON_DEV" >> $GITHUB_OUTPUT
          echo "Next dev version: $NEXT_DEV"
          echo "Python dev version: $PYTHON_DEV"

      - name: Check if already bumped
        id: check-bump
        run: |
          CURRENT_VERSION=$(cat VERSION)
          NEXT_DEV=${{ steps.next.outputs.next_dev }}
          if [ "$CURRENT_VERSION" = "$NEXT_DEV" ]; then
            echo "VERSION already set to $NEXT_DEV, skipping bump"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION is $CURRENT_VERSION, will bump to $NEXT_DEV"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version files
        if: steps.check-bump.outputs.skip != 'true'
        run: |
          NEXT_DEV=${{ steps.next.outputs.next_dev }}
          PYTHON_DEV=${{ steps.next.outputs.python_dev }}

          # Update VERSION file
          echo "$NEXT_DEV" > VERSION

          # Update Python versions (PEP 440 compliant)
          sed -i "s/^version = .*/version = \"$PYTHON_DEV\"/" pydantic-ai-server/pyproject.toml
          sed -i "s/^version = .*/version = \"$PYTHON_DEV\"/" kaos-cli/pyproject.toml

          # Update CLI __init__.py fallback version
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"$PYTHON_DEV\"/" kaos-cli/kaos_cli/__init__.py

          # Update Helm chart version
          sed -i "s/^version: .*/version: $NEXT_DEV/" operator/chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$NEXT_DEV\"/" operator/chart/Chart.yaml

          # Update Helm values.yaml image tags (must match VERSION file format without v prefix)
          # Operator uses separate repository/tag fields
          sed -i "s|^\(\s*tag:\s*\)[0-9]*\.[0-9]*\.[0-9]*[^\"]*|\1$NEXT_DEV|" operator/chart/values.yaml
          # Data plane images use full image:tag format
          sed -i "s|axsauze/kaos-agent:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-agent:$NEXT_DEV|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-server:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-server:$NEXT_DEV|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-python-string:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-python-string:$NEXT_DEV|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-pctx-codemode:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-pctx-codemode:$NEXT_DEV|g" operator/chart/values.yaml
          sed -i "s|axsauze/kaos-mcp-fastmcp-codemode:[0-9]*\.[0-9]*\.[0-9]*[^\"]*|axsauze/kaos-mcp-fastmcp-codemode:$NEXT_DEV|g" operator/chart/values.yaml

          echo "Updated files:"
          cat VERSION
          grep "^version" pydantic-ai-server/pyproject.toml
          grep "^version" kaos-cli/pyproject.toml
          grep "__version__" kaos-cli/kaos_cli/__init__.py
          grep "^version:\|^appVersion:" operator/chart/Chart.yaml
          grep -E "tag:|kaos-(agent|mcp-server|mcp-python-string|mcp-pctx-codemode|mcp-fastmcp-codemode):" operator/chart/values.yaml

      - name: Create Pull Request
        if: steps.check-bump.outputs.skip != 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump/${{ steps.next.outputs.next_dev }}
          title: "chore: bump version to ${{ steps.next.outputs.next_dev }}"
          body: |
            Automated version bump after release v${{ needs.validate.outputs.version }}

            ## Changes
            - `VERSION` → `${{ steps.next.outputs.next_dev }}`
            - Python packages → `${{ steps.next.outputs.python_dev }}`
            - CLI `__init__.py` fallback → `${{ steps.next.outputs.python_dev }}`
            - Helm chart → `${{ steps.next.outputs.next_dev }}`
            - Helm values.yaml image tags → `${{ steps.next.outputs.next_dev }}`

            ## What's Next
            This PR should be merged to prepare for the next development cycle.
          commit-message: "chore: bump version to ${{ steps.next.outputs.next_dev }}"
          delete-branch: true
          labels: |
            automated
            version-bump

      - name: Enable auto-merge for bump PR
        if: steps.check-bump.outputs.skip != 'true' && steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
