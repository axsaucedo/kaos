name: Python Tests

on:
  pull_request:
    paths:
      - 'pydantic-ai-server/**'
      - 'kaos-cli/**'
      - 'kaos-memory/**'
      - 'operator/config/samples/**'
      - '.github/workflows/python-tests.yaml'
  push:
    branches: [main]
    paths:
      - 'pydantic-ai-server/**'
      - 'kaos-cli/**'
      - 'kaos-memory/**'
      - 'operator/config/samples/**'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: pydantic-ai-server
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ../kaos-memory[pydantic-ai] -e .[dev]

      - name: Check formatting with black
        working-directory: pydantic-ai-server
        run: |
          source .venv/bin/activate
          black --check .

      - name: Run type checking
        working-directory: pydantic-ai-server
        run: uvx ty@0.0.55 check

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Python tests
        working-directory: pydantic-ai-server
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ../kaos-memory[pydantic-ai] -e .[dev]
          uv run pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: pydantic-ai-server/coverage.xml
          flags: python
          fail_ci_if_error: false

  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run CLI tests
        working-directory: kaos-cli
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install pytest pyyaml
          python -m pytest tests/ -v

  memory-service-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: kaos-memory
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[service,dev,pydantic-ai]

      - name: Check formatting with black
        working-directory: kaos-memory
        run: |
          source .venv/bin/activate
          black --check .

      - name: Run type checking
        working-directory: kaos-memory
        run: uvx ty@0.0.55 check

  memory-service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: memdb
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KAOS_TEST_PGVECTOR_DSN: postgresql://postgres:pw@localhost:55432/memdb
      OPENAI_API_KEY: dummy
      MEM0_TELEMETRY: "False"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run memory-service tests
        working-directory: kaos-memory
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[service,dev]
          uv run pytest tests/ -v
