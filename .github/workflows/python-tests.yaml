name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'pydantic-ai-server/**'
      - 'kaos-cli/**'
      - 'sync-service/**'
      - 'operator/config/samples/**'
      - '.github/workflows/python-tests.yaml'
  push:
    branches: [main]
    paths:
      - 'pydantic-ai-server/**'
      - 'kaos-cli/**'
      - 'sync-service/**'
      - 'operator/config/samples/**'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: pydantic-ai-server
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[dev]

      - name: Check formatting with black
        working-directory: pydantic-ai-server
        run: |
          source .venv/bin/activate
          black --check .

      - name: Run type checking
        working-directory: pydantic-ai-server
        run: uvx ty check

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run Python tests
        working-directory: pydantic-ai-server
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[dev]
          uv run pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: pydantic-ai-server/coverage.xml
          flags: python
          fail_ci_if_error: false

  cli-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run CLI tests
        working-directory: kaos-cli
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install pytest pyyaml
          python -m pytest tests/ -v

  sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run sync service tests
        working-directory: sync-service
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
          uv pip install pytest black
          black --check kaos_sync tests
          python -m pytest tests/ -v
