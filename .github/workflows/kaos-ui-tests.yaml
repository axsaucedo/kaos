name: KAOS UI Tests

on:
  pull_request:
    paths:
      - 'kaos-ui/**'
      - '.github/workflows/kaos-ui-tests.yaml'
  push:
    branches: [main]
    paths:
      - 'kaos-ui/**'
      - '.github/workflows/kaos-ui-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaos-ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_CLUSTER_NAME: kaos-e2e
  CI: true
  REGISTRY: axsauze

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaos-ui/package-lock.json

      - name: Install dependencies
        working-directory: kaos-ui
        run: npm ci

      - name: Build
        working-directory: kaos-ui
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaos-ui/package-lock.json

      - name: Install dependencies
        working-directory: kaos-ui
        run: npm ci

      - name: Lint
        working-directory: kaos-ui
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaos-ui/package-lock.json

      - name: Install dependencies
        working-directory: kaos-ui
        run: npm ci

      - name: Unit tests
        working-directory: kaos-ui
        run: npm run test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kaos-ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create KIND cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install kaos-cli
        run: pip install -e ./kaos-cli

      - name: Set image tags from VERSION
        run: |
          VERSION=$(cat VERSION)
          echo "OPERATOR_TAG=$VERSION" >> $GITHUB_ENV
          echo "AGENT_TAG=$VERSION" >> $GITHUB_ENV

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: ./operator
          load: true
          tags: ${{ env.REGISTRY }}/kaos-operator:${{ env.OPERATOR_TAG }}
          cache-from: type=gha,scope=operator-ui-e2e
          cache-to: type=gha,scope=operator-ui-e2e,mode=max
          github-token: ${{ github.token }}

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: ./pydantic-ai-server
          load: true
          tags: ${{ env.REGISTRY }}/kaos-agent:${{ env.AGENT_TAG }}
          cache-from: type=gha,scope=agent-ui-e2e
          cache-to: type=gha,scope=agent-ui-e2e,mode=max
          github-token: ${{ github.token }}

      - name: Build LiteLLM image
        uses: docker/build-push-action@v6
        with:
          context: ./operator/hack
          file: ./operator/hack/Dockerfile.litellm
          load: true
          tags: ghcr.io/berriai/litellm:main-stable
          cache-from: type=gha,scope=litellm-ui-e2e
          cache-to: type=gha,scope=litellm-ui-e2e,mode=max
          github-token: ${{ github.token }}

      - name: Pull Ollama image
        run: docker pull alpine/ollama:latest

      - name: Tag MCP server image
        run: |
          docker tag ${{ env.REGISTRY }}/kaos-agent:${{ env.AGENT_TAG }} ${{ env.REGISTRY }}/kaos-mcp-server:${{ env.AGENT_TAG }}

      - name: Build MCP python-string image
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-servers/python-string
          load: true
          tags: ${{ env.REGISTRY }}/kaos-mcp-python-string:${{ env.AGENT_TAG }}
          cache-from: type=gha,scope=mcp-python-string-ui-e2e
          cache-to: type=gha,scope=mcp-python-string-ui-e2e,mode=max
          github-token: ${{ github.token }}

      - name: Load images into KIND
        run: |
          kind load docker-image ${{ env.REGISTRY }}/kaos-operator:${{ env.OPERATOR_TAG }} --name ${{ env.KIND_CLUSTER_NAME }} &
          kind load docker-image ${{ env.REGISTRY }}/kaos-agent:${{ env.AGENT_TAG }} --name ${{ env.KIND_CLUSTER_NAME }} &
          kind load docker-image ${{ env.REGISTRY }}/kaos-mcp-server:${{ env.AGENT_TAG }} --name ${{ env.KIND_CLUSTER_NAME }} &
          kind load docker-image ${{ env.REGISTRY }}/kaos-mcp-python-string:${{ env.AGENT_TAG }} --name ${{ env.KIND_CLUSTER_NAME }} &
          kind load docker-image ghcr.io/berriai/litellm:main-stable --name ${{ env.KIND_CLUSTER_NAME }} &
          kind load docker-image alpine/ollama:latest --name ${{ env.KIND_CLUSTER_NAME }} &
          wait

      - name: Install KAOS operator
        run: make -C operator kind-e2e-install-kaos IMAGE_TAG=${{ env.OPERATOR_TAG }} REGISTRY=${{ env.REGISTRY }}

      - name: Deploy sample resources
        run: |
          kubectl apply --server-side -f operator/config/samples/ -n kaos-hierarchy || true
          sleep 10
          kubectl get agents,mcpservers,modelapis -n kaos-hierarchy

      - name: Install UI dependencies
        working-directory: kaos-ui
        run: npm ci

      - name: Build UI
        working-directory: kaos-ui
        run: npm run build

      - name: Install Playwright browsers
        working-directory: kaos-ui
        run: npx playwright install --with-deps chromium

      - name: Start UI server and proxy
        run: |
          cd kaos-ui && npx vite preview --port 8080 &
          sleep 3

          # Set up port-forward to Gateway for proxy
          GATEWAY_SVC=$(kubectl get svc -n envoy-gateway-system -l "gateway.envoyproxy.io/owning-gateway-name=kaos-gateway" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -n "$GATEWAY_SVC" ]; then
            kubectl port-forward -n envoy-gateway-system "svc/${GATEWAY_SVC}" 8888:80 &
            sleep 3
          fi

          # Start kaos UI proxy
          kaos ui --no-browser &
          sleep 3

      - name: Run Playwright E2E tests
        working-directory: kaos-ui
        run: npx playwright test --reporter=list --workers=1

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kaos-ui/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: kaos-ui/test-results/
          retention-days: 7

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== All Pods ==="
          kubectl get pods -A
          echo "=== Operator Logs ==="
          kubectl logs -n kaos-system -l app.kubernetes.io/name=kaos-operator --tail=100 || true
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50
