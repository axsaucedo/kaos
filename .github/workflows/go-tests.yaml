name: Go Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
      - 'sync-service/**'
      - '.github/workflows/go-tests.yaml'
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - 'sync-service/**'
      - '.github/workflows/go-tests.yaml'
  workflow_dispatch:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install tools
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.19.0
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.24

      - name: Run Go tests
        working-directory: operator
        run: make test-unit

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: operator/cover.out
          flags: go
          fail_ci_if_error: false

  sync-service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sync-service/go.mod
          cache-dependency-path: sync-service/go.sum

      - name: Check formatting
        working-directory: sync-service
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: Vet
        working-directory: sync-service
        run: go vet ./...

      - name: Run Go tests
        working-directory: sync-service
        run: go test ./... -v
