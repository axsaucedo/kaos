name: Sync Standalone Repos

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Which repo to sync'
        type: choice
        options:
          - all
          - pydantic-ai-server
          - kaos-ui
        default: 'all'

permissions:
  contents: read

jobs:
  sync-pydantic-ai-server:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.repo == 'all' ||
      github.event.inputs.repo == 'pydantic-ai-server'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push subtree to pydantic-ai-server
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # Remove default credential helper set by actions/checkout so our token is used
          git config --unset-all http.https://github.com/.extraheader || true
          git remote add pydantic-ai-server https://x-access-token:${CROSS_REPO_TOKEN}@github.com/axsaucedo/pydantic-ai-server.git 2>/dev/null || true
          # Split subtree into a temporary branch and push (force on first sync to align histories)
          git subtree split --prefix=pydantic-ai-server -b _split-pais
          git push pydantic-ai-server _split-pais:main --force
          git branch -D _split-pais

  sync-kaos-ui:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.repo == 'all' ||
      github.event.inputs.repo == 'kaos-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push subtree to kaos-ui
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # Remove default credential helper set by actions/checkout so our token is used
          git config --unset-all http.https://github.com/.extraheader || true
          git remote add kaos-ui https://x-access-token:${CROSS_REPO_TOKEN}@github.com/axsaucedo/kaos-ui.git 2>/dev/null || true
          # Split subtree into a temporary branch and push (force on first sync to align histories)
          git subtree split --prefix=kaos-ui -b _split-ui
          git push kaos-ui _split-ui:main --force
          git branch -D _split-ui
