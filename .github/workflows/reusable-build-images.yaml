name: Build and Push Images

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for images'
        required: true
        type: string
      push-latest:
        description: 'Also tag as latest'
        required: false
        type: boolean
        default: false
      artifact-prefix:
        description: 'Prefix for artifact names to avoid conflicts'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  REGISTRY: docker.io
  OPERATOR_IMAGE: axsauze/kaos-operator
  AGENT_IMAGE: axsauze/kaos-agent
  MCP_PYTHON_STRING_IMAGE: axsauze/kaos-mcp-python-string
  SYNC_IMAGE: axsauze/kaos-sync
  MEMORY_IMAGE: axsauze/kaos-memory-service

jobs:
  # Build operator image on native runners for each platform
  build-operator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.OPERATOR_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./operator
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.OPERATOR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=operator-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=operator-${{ env.PLATFORM_PAIR }},mode=max
          github-token: ${{ github.token }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/operator
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/operator/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}operator-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/operator/*
          if-no-files-found: error
          retention-days: 1

  # Build agent image on native runners for each platform
  build-agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./pydantic-ai-server
          build-contexts: |
            kaos-memory=./kaos-memory
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.AGENT_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agent-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=agent-${{ env.PLATFORM_PAIR }},mode=max
          github-token: ${{ github.token }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/agent
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/agent/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}agent-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/agent/*
          if-no-files-found: error
          retention-days: 1

  # Merge operator manifests from all platforms
  merge-operator:
    runs-on: ubuntu-latest
    needs: build-operator
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/operator
          pattern: ${{ inputs.artifact-prefix }}operator-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.OPERATOR_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.push-latest }}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/operator
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.OPERATOR_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.OPERATOR_IMAGE }}:${{ inputs.version }}

  # Merge agent manifests from all platforms
  merge-agent:
    runs-on: ubuntu-latest
    needs: build-agent
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/agent
          pattern: ${{ inputs.artifact-prefix }}agent-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.push-latest }}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/agent
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.AGENT_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.AGENT_IMAGE }}:${{ inputs.version }}

  # Build MCP python-string image on native runners for each platform
  build-mcp-python-string:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MCP_PYTHON_STRING_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-servers/python-string
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.MCP_PYTHON_STRING_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=mcp-python-string-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=mcp-python-string-${{ env.PLATFORM_PAIR }},mode=max
          github-token: ${{ github.token }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/mcp-python-string
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/mcp-python-string/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}mcp-python-string-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/mcp-python-string/*
          if-no-files-found: error
          retention-days: 1

  # Merge MCP python-string manifests from all platforms
  merge-mcp-python-string:
    runs-on: ubuntu-latest
    needs: build-mcp-python-string
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/mcp-python-string
          pattern: ${{ inputs.artifact-prefix }}mcp-python-string-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MCP_PYTHON_STRING_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.push-latest }}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/mcp-python-string
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.MCP_PYTHON_STRING_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.MCP_PYTHON_STRING_IMAGE }}:${{ inputs.version }}

  # Build sync service image on native runners for each platform
  build-sync:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SYNC_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./sync-service
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.SYNC_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sync-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=sync-${{ env.PLATFORM_PAIR }},mode=max
          github-token: ${{ github.token }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/sync
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/sync/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}sync-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/sync/*
          if-no-files-found: error
          retention-days: 1

  # Merge sync service manifests from all platforms
  merge-sync:
    runs-on: ubuntu-latest
    needs: build-sync
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/sync
          pattern: ${{ inputs.artifact-prefix }}sync-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SYNC_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.push-latest }}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/sync
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.SYNC_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.SYNC_IMAGE }}:${{ inputs.version }}

  # Build memory service image on native runners for each platform
  build-memory-service:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MEMORY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./kaos-memory
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.MEMORY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=memory-service-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=memory-service-${{ env.PLATFORM_PAIR }},mode=max
          github-token: ${{ github.token }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/memory-service
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/memory-service/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}memory-service-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/memory-service/*
          if-no-files-found: error
          retention-days: 1

  # Merge memory service manifests from all platforms
  merge-memory-service:
    runs-on: ubuntu-latest
    needs: build-memory-service
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/memory-service
          pattern: ${{ inputs.artifact-prefix }}memory-service-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MEMORY_IMAGE }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.push-latest }}
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests/memory-service
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.MEMORY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.MEMORY_IMAGE }}:${{ inputs.version }}
