version: 2

# Major-version policy
# --------------------
# Majors are never bundled into a grouped PR: every `all` version-update group
# below is restricted to `minor` and `patch`, so a major always arrives as its
# own reviewable PR instead of hiding inside a 36-package lock refresh. The
# `all-security` groups are deliberately left unrestricted — a security fix may
# only exist in a new major, and must never be filtered out.
#
# We do not adopt a major at its `.0.0`. A brand-new X.0.0 is the least-tested
# release of that line, so we wait for X.1.0. Dependabot has no wildcard for
# "any major's .0.*" — `ignore.versions` ranges are literal, and `cooldown`
# cannot express it either (once X.0.0 ages past the cooldown window Dependabot
# offers *that* version, which is the opposite of what we want). So the policy
# is enforced per dependency, as each major actually appears:
#
#   When a major PR for X.0.0 shows up, close it and add:
#
#     ignore:
#       - dependency-name: "<name>"
#         versions: ["X.0.x"]        # adopt this major at X.1.0, not X.0.0
#
#   Dependabot then re-proposes the dependency once X.1.0 ships. Drop the entry
#   again after the major is adopted, so later majors are not silently skipped.
#
# Use `update-types: ["version-update:semver-major"]` instead (see `typescript`
# under /kaos-ui) only when a major must be blocked outright, not deferred.
updates:
  # Python - kaos-cli
  - package-ecosystem: "pip"
    directory: "/kaos-cli"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - pydantic-ai-server
  - package-ecosystem: "pip"
    directory: "/pydantic-ai-server"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - MCP python-string
  - package-ecosystem: "pip"
    directory: "/mcp-servers/python-string"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - MCP fastmcp-codemode
  - package-ecosystem: "pip"
    directory: "/mcp-servers/fastmcp-codemode"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - E2E test deps
  - package-ecosystem: "pip"
    directory: "/operator/tests"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm - kaos-ui
  # Framework majors here (React, React Router, Vite, Zod, Zustand, etc.) are
  # migrations: review each individually, and never auto-merge one — CI cannot
  # see visual regressions.
  - package-ecosystem: "npm"
    directory: "/kaos-ui"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # typescript-eslint has no TypeScript 7 support yet: its peer range caps at
      # <6.1.0 and it also hard-throws on major >= 7, so `npm ci` fails outright.
      # Upstream typescript-eslint#10940 targets TS >= 7.1 — remove this once it
      # ships. TS 6.x minor/patch updates are unaffected.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # npm - docs
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Go - operator
  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
