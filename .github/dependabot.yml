    directory: "/operator/tests"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm - kaos-ui
  - package-ecosystem: "npm"
    directory: "/kaos-ui"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # npm - docs
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
