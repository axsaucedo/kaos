version: 2
updates:
  # Python - kaos-cli
  - package-ecosystem: "pip"
    directory: "/kaos-cli"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - pydantic-ai-server
  - package-ecosystem: "pip"
    directory: "/pydantic-ai-server"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # Python - MCP python-string
