  # Go - operator
  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    groups:
      all:
        applies-to: version-updates
        patterns: ["*"]
      all-security:
        applies-to: security-updates
        patterns: ["*"]
