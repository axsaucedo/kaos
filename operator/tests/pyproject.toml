[project]
name = "operator-tests"
version = "0.1.0"
description = "Operator tests"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "sh>=2.2.2",
    "mcp>=1.0.0",
    "jupytext>=1.16.0",
    "nbconvert>=7.17.1",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Parallel execution: use -n 4 --dist loadscope for ~3min runtime
# Sequential execution (default): ~6min runtime
# Example: pytest e2e/ -n 4 --dist loadscope
markers = [
    "aib: agent-auth end-to-end tests that require the identity broker and sync service installed (opt-in, set KAOS_AIB_E2E=1)",
]
