---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: thirdpartyservices.kaos.tools
spec:
  group: kaos.tools
  names:
    kind: ThirdPartyService
    listKind: ThirdPartyServiceList
    plural: thirdpartyservices
    shortNames:
    - tps
    singular: thirdpartyservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.issuerURI
      name: Issuer
      type: string
    - jsonPath: .spec.routeRef.name
      name: Route
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ThirdPartyService declares an external OAuth service and namespaced
          Agent bindings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ThirdPartyServiceSpec declares an OAuth service and the agents
              allowed to use it.
            properties:
              access:
                description: Access declares real Agent-to-service scope bindings.
                items:
                  description: ThirdPartyServiceAccess binds one namespaced Agent
                    to provider scopes.
                  properties:
                    agent:
                      description: Agent is the name of an Agent in this namespace.
                      minLength: 1
                      type: string
                    scopes:
                      description: Scopes is the subset of service scopes granted
                        to the Agent.
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - agent
                  - scopes
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - agent
                x-kubernetes-list-type: map
              clientID:
                description: ClientID is the OAuth client registered with the third-party
                  provider.
                minLength: 1
                type: string
              clientSecretRef:
                description: ClientSecretRef references the provider OAuth client
                  secret.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              displayName:
                description: DisplayName is the human-readable provider name. It defaults
                  to metadata.name.
                type: string
              endpoints:
                description: Endpoints explicitly configures OAuth endpoints when
                  the issuer has no discovery document.
                properties:
                  authorization:
                    description: Authorization is the provider's OAuth authorization
                      endpoint.
                    pattern: ^https?://
                    type: string
                  token:
                    description: Token is the provider's OAuth token endpoint.
                    pattern: ^https?://
                    type: string
                required:
                - authorization
                - token
                type: object
              issuerURI:
                description: IssuerURI is the third-party OAuth issuer. AIB uses discovery
                  when Endpoints is omitted.
                pattern: ^https?://
                type: string
              protectedResources:
                description: ProtectedResources lists external resource URLs whose
                  credentials AIB may exchange.
                items:
                  type: string
                minItems: 1
                type: array
              routeRef:
                description: RouteRef identifies the dedicated third-party egress
                  HTTPRoute. Internal KAOS routes are never selected implicitly.
                properties:
                  name:
                    description: Name is the HTTPRoute that carries only this service's
                      external traffic.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              scopes:
                description: Scopes lists the OAuth scopes this declaration may grant.
                items:
                  description: ThirdPartyServiceScope is an OAuth scope exposed by
                    the third-party service.
                  properties:
                    description:
                      description: Description explains what the scope permits.
                      type: string
                    name:
                      description: Name is the provider scope value.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - access
            - clientID
            - clientSecretRef
            - issuerURI
            - protectedResources
            - routeRef
            - scopes
            type: object
          status:
            description: ThirdPartyServiceStatus reports token-exchange projection
              and route attachment.
            properties:
              conditions:
                description: Conditions represent the latest observations of the service
                  integration.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
