apiVersion: v1
kind: ConfigMap
metadata:
  name: kaos-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  # System namespace where operator resources are deployed
  SYSTEM_NAMESPACE: {{ .Release.Namespace | quote }}
  # Default images for operator-managed resources
  DEFAULT_AGENT_IMAGE: {{ .Values.defaultImages.agentRuntime | quote }}
  DEFAULT_MCP_SERVER_IMAGE: {{ .Values.defaultImages.mcpServer | quote }}
  DEFAULT_LITELLM_IMAGE: {{ .Values.defaultImages.litellm | quote }}
  DEFAULT_OLLAMA_IMAGE: {{ .Values.defaultImages.ollama | quote }}
  # Gateway API configuration
  {{- if .Values.gatewayAPI.enabled }}
  GATEWAY_API_ENABLED: "true"
  GATEWAY_NAME: {{ .Values.gatewayAPI.gatewayName | default "kaos-gateway" | quote }}
  GATEWAY_NAMESPACE: {{ .Values.gatewayAPI.gatewayNamespace | default .Release.Namespace | quote }}
  {{- else }}
  GATEWAY_API_ENABLED: "false"
  {{- end }}
  # Gateway default timeouts (Gateway API Duration format)
  GATEWAY_DEFAULT_AGENT_TIMEOUT: {{ .Values.gateway.defaultTimeouts.agent | quote }}
  GATEWAY_DEFAULT_MODELAPI_TIMEOUT: {{ .Values.gateway.defaultTimeouts.modelAPI | quote }}
  GATEWAY_DEFAULT_MCP_TIMEOUT: {{ .Values.gateway.defaultTimeouts.mcp | quote }}
  # Operator-wide security configuration. The presence of an agent-auth
  # ext_authz URL enables gateway authorization enforcement (Envoy ext_authz)
  # on protected routes; leaving it empty disables enforcement and leaves
  # existing routing behavior unchanged.
  {{- with .Values.security }}
  {{- with .agentAuth }}
  {{- if .extAuthzUrl }}
  SECURITY_AGENT_AUTH_EXT_AUTHZ_URL: {{ .extAuthzUrl | quote }}
  {{- end }}
  {{- if .extProcUrl }}
  SECURITY_AGENT_AUTH_EXT_PROC_URL: {{ .extProcUrl | quote }}
  {{- end }}
  {{- if .issuer }}
  SECURITY_AGENT_AUTH_ISSUER: {{ .issuer | quote }}
  {{- end }}
  {{- if .credentialSecretPrefix }}
  SECURITY_AGENT_AUTH_CREDENTIAL_SECRET_PREFIX: {{ .credentialSecretPrefix | quote }}
  {{- end }}
  {{- if .adminUrl }}
  # Identity projection: when an admin URL is set the operator registers agents,
  # mints per-agent credential Secrets, and projects services/permission sets
  # into the broker admin API.
  AIB_ADMIN_URL: {{ .adminUrl | quote }}
  AIB_PRINCIPAL: {{ .adminPrincipal | default "kaos-operator" | quote }}
  AIB_PRINCIPAL_HEADER: {{ .adminPrincipalHeader | default "X-Remote-User" | quote }}
  {{- with .projection }}
  {{- if .namespaces }}
  AIB_PROJECTION_NAMESPACES: {{ .namespaces | quote }}
  {{- end }}
  {{- if hasKey . "prune" }}
  AIB_PROJECTION_PRUNE_ENABLED: {{ .prune | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with .userAuth }}
  {{- if .issuer }}
  SECURITY_USER_AUTH_ISSUER: {{ .issuer | quote }}
  {{- end }}
  {{- if .audience }}
  SECURITY_USER_AUTH_AUDIENCE: {{ .audience | quote }}
  {{- end }}
  {{- if .jwksUri }}
  SECURITY_USER_AUTH_JWKS_URI: {{ .jwksUri | quote }}
  {{- end }}
  {{- end }}
  # Bypass-prevention and gateway-routing configuration. These only take effect
  # when security is operational (agentAuth.extAuthzUrl set).
  SECURITY_OPERATOR_NAMESPACE: {{ $.Release.Namespace | quote }}
  {{- if .gatewayNamespace }}
  SECURITY_GATEWAY_NAMESPACE: {{ .gatewayNamespace | quote }}
  {{- end }}
  {{- if .gatewayHost }}
  SECURITY_GATEWAY_HOST: {{ .gatewayHost | quote }}
  {{- end }}
  {{- if and .networkPolicy (not .networkPolicy.enabled) }}
  SECURITY_NETWORK_POLICY_DISABLED: "true"
  {{- end }}
  {{- if and .networkPolicy .networkPolicy.egress .networkPolicy.egress.enabled }}
  SECURITY_NETWORK_POLICY_EGRESS_ENABLED: "true"
  {{- end }}
  {{- if and .gatewayRouting .gatewayRouting.enabled }}
  SECURITY_GATEWAY_ROUTING_ENABLED: "true"
  {{- end }}
  {{- end }}
  # Global telemetry configuration (defaults for all components)
  {{- if .Values.telemetry.enabled }}
  DEFAULT_TELEMETRY_ENABLED: "true"
  DEFAULT_TELEMETRY_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  {{- else }}
  DEFAULT_TELEMETRY_ENABLED: "false"
  {{- end }}
  # Global log level for all components
  DEFAULT_LOG_LEVEL: {{ .Values.logLevel | default "INFO" | upper | quote }}
  # Agent defaults: memory configuration
  {{- if eq .Values.agentDefaults.memory.type "redis" }}
  DEFAULT_REDIS_URL: {{ .Values.agentDefaults.memory.redisUrl | quote }}
  {{- end }}
