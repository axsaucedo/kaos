apiVersion: v1
kind: ConfigMap
metadata:
  name: kaos-operator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  # System namespace where operator resources are deployed
  SYSTEM_NAMESPACE: {{ .Release.Namespace | quote }}
  # Default images for operator-managed resources
  DEFAULT_AGENT_IMAGE: {{ .Values.defaultImages.agentRuntime | quote }}
  DEFAULT_MCP_SERVER_IMAGE: {{ .Values.defaultImages.mcpServer | quote }}
  DEFAULT_LITELLM_IMAGE: {{ .Values.defaultImages.litellm | quote }}
  DEFAULT_OLLAMA_IMAGE: {{ .Values.defaultImages.ollama | quote }}
  DEFAULT_MEMORY_SERVICE_IMAGE: {{ .Values.defaultImages.memoryService | quote }}
  # Gateway API configuration
  {{- if .Values.gatewayAPI.enabled }}
  GATEWAY_API_ENABLED: "true"
  GATEWAY_NAME: {{ .Values.gatewayAPI.gatewayName | default "kaos-gateway" | quote }}
  GATEWAY_NAMESPACE: {{ .Values.gatewayAPI.gatewayNamespace | default .Release.Namespace | quote }}
  {{- else }}
  GATEWAY_API_ENABLED: "false"
  {{- end }}
  # Gateway default timeouts (Gateway API Duration format)
  GATEWAY_DEFAULT_AGENT_TIMEOUT: {{ .Values.gateway.defaultTimeouts.agent | quote }}
  GATEWAY_DEFAULT_MODELAPI_TIMEOUT: {{ .Values.gateway.defaultTimeouts.modelAPI | quote }}
  GATEWAY_DEFAULT_MCP_TIMEOUT: {{ .Values.gateway.defaultTimeouts.mcp | quote }}
  # Operator-wide security configuration.
  {{- if .Values.security.pdp.enabled }}
  SECURITY_PDP_ENABLED: "true"
  {{- end }}
  {{- with .Values.security }}
  {{- if .tokenExchange.enabled }}
  {{- if not (and $.Values.gatewayAPI.enabled $.Values.gatewayAPI.createGateway) }}
  {{- fail "security.tokenExchange.enabled requires gatewayAPI.enabled and gatewayAPI.createGateway" }}
  {{- end }}
  {{- if ne (.agentAuth.identity.provider | default "serviceaccount") "oidc" }}
  {{- fail "security.tokenExchange.enabled requires security.agentAuth.identity.provider=oidc" }}
  {{- end }}
  {{- if not .agentAuth.issuer }}
  {{- fail "security.tokenExchange.enabled requires security.agentAuth.issuer" }}
  {{- end }}
  {{- if not (or $.Values.security.pdp.enabled .agentAuth.extAuthzUrl) }}
  {{- fail "security.tokenExchange.enabled requires the ext_authz PDP" }}
  {{- end }}
  {{- if not .userAuth.issuer }}
  {{- fail "security.tokenExchange.enabled requires security.userAuth.issuer" }}
  {{- end }}
  {{- if not .tokenExchange.aib.adminUrl }}
  {{- fail "security.tokenExchange.enabled requires security.tokenExchange.aib.adminUrl" }}
  {{- end }}
  TOKEN_EXCHANGE_ENABLED: "true"
  TOKEN_EXCHANGE_AIB_ADMIN_URL: {{ .tokenExchange.aib.adminUrl | quote }}
  TOKEN_EXCHANGE_AIB_PRINCIPAL: {{ .tokenExchange.aib.adminPrincipal | default "kaos-operator" | quote }}
  TOKEN_EXCHANGE_AIB_PRINCIPAL_HEADER: {{ .tokenExchange.aib.adminPrincipalHeader | default "X-Remote-User" | quote }}
  TOKEN_EXCHANGE_EXTPROC_SERVICE_NAME: {{ required "security.tokenExchange.extProc.serviceName is required" .tokenExchange.extProc.serviceName | quote }}
  TOKEN_EXCHANGE_EXTPROC_NAMESPACE: {{ required "security.tokenExchange.extProc.namespace is required" .tokenExchange.extProc.namespace | quote }}
  TOKEN_EXCHANGE_EXTPROC_PORT: {{ .tokenExchange.extProc.port | default 50051 | quote }}
  {{- end }}
  {{- with .agentAuth }}
  {{- $identityProvider := .identity.provider | default "serviceaccount" }}
  {{- if not (has $identityProvider (list "serviceaccount" "oidc" "aib")) }}
  {{- fail "security.agentAuth.identity.provider must be one of: serviceaccount, oidc, aib" }}
  {{- end }}
  SECURITY_AGENT_AUTH_IDENTITY_PROVIDER: {{ $identityProvider | quote }}
  SECURITY_AGENT_AUTH_GATEWAY_JWT_OPTIONAL: {{ .gatewayJwtOptional | quote }}
  {{- if eq $identityProvider "serviceaccount" }}
  SECURITY_AGENT_AUTH_SERVICE_ACCOUNT_AUDIENCE: {{ .identity.serviceAccount.audience | default "kaos-gateway" | quote }}
  SECURITY_AGENT_AUTH_SERVICE_ACCOUNT_EXPIRATION_SECONDS: {{ .identity.serviceAccount.expirationSeconds | default 3600 | quote }}
  SECURITY_AGENT_AUTH_SERVICE_ACCOUNT_TOKEN_PATH: {{ .identity.serviceAccount.tokenPath | default "/var/run/secrets/kaos-agent/token" | quote }}
  {{- end }}
  {{- with .authorization }}
  {{- if .policyDataSource }}
  SECURITY_AUTHORIZATION_POLICY_DATA_SOURCE: {{ .policyDataSource | quote }}
  {{- end }}
  {{- if .policyRegoOverride }}
  SECURITY_AUTHORIZATION_POLICY_REGO_OVERRIDE: {{ .policyRegoOverride | quote }}
  {{- end }}
  {{- end }}
  {{- if .extAuthzUrl }}
  SECURITY_AGENT_AUTH_EXT_AUTHZ_URL: {{ .extAuthzUrl | quote }}
  {{- else if $.Values.security.pdp.enabled }}
  SECURITY_AGENT_AUTH_EXT_AUTHZ_URL: {{ printf "kaos-pdp.%s.svc:9191" $.Release.Namespace | quote }}
  {{- end }}
  {{- if and (ne $identityProvider "serviceaccount") .issuer }}
  SECURITY_AGENT_AUTH_ISSUER: {{ .issuer | quote }}
  {{- end }}
  {{- if and (or (eq $identityProvider "aib") (eq $identityProvider "oidc")) (or .credentialSecretPrefix (eq $identityProvider "oidc")) }}
  SECURITY_AGENT_AUTH_CREDENTIAL_SECRET_PREFIX: {{ .credentialSecretPrefix | default "kaos-oidc" | quote }}
  {{- end }}
  {{- if and (eq $identityProvider "aib") .adminUrl }}
  # Broker identity projection: when an admin URL is set the operator registers
  # agents and mints per-agent credential Secrets through the broker admin API.
  AIB_ADMIN_URL: {{ .adminUrl | quote }}
  AIB_PRINCIPAL: {{ .adminPrincipal | default "kaos-operator" | quote }}
  AIB_PRINCIPAL_HEADER: {{ .adminPrincipalHeader | default "X-Remote-User" | quote }}
  {{- end }}
  {{- with .projection }}
  {{- if .namespaces }}
  AUTHZ_PROJECTION_NAMESPACES: {{ .namespaces | quote }}
  {{- end }}
  {{- if hasKey . "prune" }}
  AUTHZ_PROJECTION_PRUNE_ENABLED: {{ .prune | quote }}
  {{- end }}
  {{- with .policyConfigMap }}
  {{- if and .name .namespace }}
  AUTHZ_POLICY_CONFIGMAP_NAME: {{ .name | quote }}
  AUTHZ_POLICY_CONFIGMAP_NAMESPACE: {{ .namespace | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- with .userAuth }}
  {{- if .issuer }}
  SECURITY_USER_AUTH_ISSUER: {{ .issuer | quote }}
  {{- end }}
  {{- if .audience }}
  SECURITY_USER_AUTH_AUDIENCE: {{ .audience | quote }}
  {{- end }}
  {{- if .jwksUri }}
  SECURITY_USER_AUTH_JWKS_URI: {{ .jwksUri | quote }}
  {{- end }}
  {{- end }}
  # Bypass-prevention and gateway-routing configuration. These only take effect
  # when security is operational (agentAuth.extAuthzUrl set).
  SECURITY_OPERATOR_NAMESPACE: {{ $.Release.Namespace | quote }}
  {{- if .gatewayNamespace }}
  SECURITY_GATEWAY_NAMESPACE: {{ .gatewayNamespace | quote }}
  {{- end }}
  {{- if .gatewayHost }}
  SECURITY_GATEWAY_HOST: {{ .gatewayHost | quote }}
  {{- end }}
  {{- if and .networkPolicy (not .networkPolicy.enabled) }}
  SECURITY_NETWORK_POLICY_DISABLED: "true"
  {{- end }}
  {{- if and .networkPolicy .networkPolicy.egress .networkPolicy.egress.enabled }}
  SECURITY_NETWORK_POLICY_EGRESS_ENABLED: "true"
  {{- end }}
  {{- if and .gatewayRouting .gatewayRouting.enabled }}
  SECURITY_GATEWAY_ROUTING_ENABLED: "true"
  {{- end }}
  {{- if and .strictGatewayApi .strictGatewayApi.enabled }}
  SECURITY_STRICT_GATEWAY_API_ENABLED: "true"
  {{- end }}
  {{- end }}
  # Global telemetry configuration (defaults for all components)
  {{- if .Values.telemetry.enabled }}
  DEFAULT_TELEMETRY_ENABLED: "true"
  DEFAULT_TELEMETRY_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  {{- else }}
  DEFAULT_TELEMETRY_ENABLED: "false"
  {{- end }}
  # Global log level for all components
  DEFAULT_LOG_LEVEL: {{ .Values.logLevel | default "INFO" | upper | quote }}
