{{- if and .Values.gatewayAPI.enabled .Values.gatewayAPI.createGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayAPI.gatewayName | default "kaos-gateway" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gatewayAPI.gatewayClassName is required when createGateway is true" .Values.gatewayAPI.gatewayClassName }}
  {{- if .Values.security.tokenExchange.enabled }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gatewayAPI.gatewayName | default "kaos-gateway" }}-token-exchange
  {{- end }}
  listeners:
  - name: http
    port: {{ .Values.gatewayAPI.listenerPort | default 80 }}
    protocol: {{ .Values.gatewayAPI.listenerProtocol | default "HTTP" }}
    allowedRoutes:
      namespaces:
        from: All
{{- with .Values.security.tls }}
{{- if .mode }}
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ if eq .mode "provided" }}{{ required "security.tls.secretName is required when security.tls.mode is provided" .secretName }}{{ else }}{{ $.Values.gatewayAPI.gatewayName | default "kaos-gateway" }}-tls{{ end }}
    allowedRoutes:
      namespaces:
        from: All
{{- end }}
{{- end }}
{{- with .Values.security.tls }}
{{- if and .mode .minVersion }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $.Values.gatewayAPI.gatewayName | default "kaos-gateway" }}-tls
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $.Values.gatewayAPI.gatewayName | default "kaos-gateway" }}
  tls:
    minVersion: {{ .minVersion | quote }}
{{- end }}
{{- end }}
{{- if .Values.security.tokenExchange.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gatewayAPI.gatewayName | default "kaos-gateway" }}-token-exchange
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  filterOrder:
    - name: envoy.filters.http.ext_authz
      after: envoy.filters.http.jwt_authn
    - name: envoy.filters.http.ext_proc
      after: envoy.filters.http.ext_authz
{{- end }}
{{- end }}
