controllerManager:
  manager:
    args:
    - --leader-elect
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    image:
      repository: axsauze/kaos-operator
      tag: 0.4.8-dev
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
kubernetesClusterDomain: cluster.local

# Default images for agent runtime and MCP servers
defaultImages:
  agentRuntime: axsauze/kaos-agent:0.4.8-dev
  mcpServer: axsauze/kaos-mcp-server:0.4.8-dev
  mcpPythonString: axsauze/kaos-mcp-python-string:0.4.8-dev
  mcpPctxCodemode: axsauze/kaos-mcp-pctx-codemode:0.4.8-dev
  mcpFastmcpCodemode: axsauze/kaos-mcp-fastmcp-codemode:0.4.8-dev
  mcpKubernetes: quay.io/containers/kubernetes_mcp_server:latest
  mcpSlack: zencoderai/slack-mcp:latest
  litellm: ghcr.io/berriai/litellm:main-stable
  ollama: ollama/ollama:latest

# MCP Runtime registry configuration
mcpRuntimes:
  # Add custom runtimes here (will be merged into ConfigMap)
  custom: {}
  # Example:
  # custom:
  #   myruntime:
  #     type: python
  #     image: myregistry/my-mcp:v1
  #     description: "My custom MCP server"

# Gateway API configuration
gatewayAPI:
  enabled: false
  createGateway: false
  gatewayName: kaos-gateway
  gatewayClassName: ""
  gatewayNamespace: ""
  listenerPort: 80
  listenerProtocol: HTTP

# Gateway timeout settings
gateway:
  defaultTimeouts:
    agent: "300s"
    modelAPI: "120s"
    mcp: "60s"

# Resource-level authorization (access-check) enforcement at the gateway.
# When enabled, the operator attaches an external authorization check to
# protected routes so requests are allowed or denied based on the calling
# agent's granted permissions. Disabled by default — routing is unchanged.
security:
  # Operator-wide security configuration. Security is enabled by the presence of
  # an agent-auth ext_authz URL; when unset, the operator generates no
  # authorization policies and routing behavior is unchanged.
  agentAuth:
    # extAuthzUrl is the host:port of the Envoy ext_authz access-check gRPC
    # backend (AIB by default; OPA is a drop-in via the standard contract).
    # Example: aib-ext-authz.aib-system.svc.cluster.local:9002
    extAuthzUrl: ""

serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""

# Global telemetry configuration (applies to all components)
# Component-level telemetry config overrides these defaults
telemetry:
  # enabled controls whether telemetry is enabled by default for all components
  enabled: false
  # endpoint is the OTLP endpoint URL (required when enabled)
  # Example: "http://otel-collector.observability:4317"
  endpoint: ""

# Global log level for all components (control plane and data plane)
# Supported values: TRACE, DEBUG, INFO, WARNING, ERROR
# - Control plane (operator): Uses Go slog levels
# - Data plane (Agent, MCPServer): Uses Python logging levels
# - ModelAPI (LiteLLM): Maps to LITELLM_LOG
# - ModelAPI (Ollama): Maps to OLLAMA_DEBUG
logLevel: INFO

# Agent defaults configuration
agentDefaults:
  memory:
    # type is the default memory backend: "local" or "redis"
    type: local
    # redisUrl is the Redis connection URL (used when type is "redis")
    # Example: "redis://redis.kaos-system:6379"
    redisUrl: ""
