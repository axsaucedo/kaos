controllerManager:
  manager:
    args:
    - --leader-elect
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    image:
      repository: axsauze/kaos-operator
      tag: 0.6.1-dev
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
kubernetesClusterDomain: cluster.local

# Default images for agent runtime and MCP servers
defaultImages:
  agentRuntime: axsauze/kaos-agent:0.6.1-dev
  mcpServer: axsauze/kaos-mcp-server:0.6.1-dev
  mcpPythonString: axsauze/kaos-mcp-python-string:0.6.1-dev
  mcpPctxCodemode: axsauze/kaos-mcp-pctx-codemode:0.6.1-dev
  mcpFastmcpCodemode: axsauze/kaos-mcp-fastmcp-codemode:0.6.1-dev
  mcpKubernetes: quay.io/containers/kubernetes_mcp_server:latest
  mcpSlack: zencoderai/slack-mcp:latest
  litellm: ghcr.io/berriai/litellm:main-stable
  ollama: ollama/ollama:latest
  memoryService: axsauze/kaos-memory-service:0.4.8-dev

# MCP Runtime registry configuration
mcpRuntimes:
  # Add custom runtimes here (will be merged into ConfigMap)
  custom: {}
  # Example:
  # custom:
  #   myruntime:
  #     type: python
  #     image: myregistry/my-mcp:v1
  #     description: "My custom MCP server"

# Gateway API configuration
gatewayAPI:
  enabled: false
  createGateway: false
  gatewayName: kaos-gateway
  gatewayClassName: ""
  gatewayNamespace: ""
  listenerPort: 80
  listenerProtocol: HTTP

# Gateway timeout settings
gateway:
  defaultTimeouts:
    agent: "300s"
    modelAPI: "120s"
    mcp: "60s"

# Resource-level authorization (access-check) enforcement at the gateway.
# When enabled, the operator attaches an external authorization check to
# protected routes so requests are allowed or denied based on the calling
# agent's granted permissions. Disabled by default — routing is unchanged.
security:
  # pdp runs stock OPA with the Envoy ext_authz gRPC plugin. It is disabled
  # until gateway enforcement is enabled separately.
  pdp:
    enabled: false
    image: openpolicyagent/opa:1.18.1-envoy-static
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # Operator-wide security configuration. Security is enabled by the presence of
  # an agent-auth ext_authz URL; when unset, the operator generates no
  # authorization policies and routing behavior is unchanged.
  agentAuth:
    # gatewayJwtOptional keeps gateway JWT non-blocking so the PDP is the sole
    # authority. This is REQUIRED for autonomous agents: their propagated
    # self-subject is an agent-issuer token in Authorization that the Keycloak user
    # provider would otherwise reject before the PDP runs. Set false ONLY when no
    # autonomous agents run and gateway rejection of invalid tokens is desired.
    # The PDP enforces in all cases; this has no effect without the PDP.
    gatewayJwtOptional: true
    # identity selects exactly one agent token issuer.
    identity:
      # provider is serviceaccount, oidc, or aib.
      provider: serviceaccount
      serviceAccount:
        audience: kaos-gateway
        expirationSeconds: 3600
        tokenPath: /var/run/secrets/kaos-agent/token
      oidc:
        registration:
          # initialAccessTokenSecretRef authorizes RFC 7591 Dynamic Client
          # Registration. Both name and key are required to enable projection.
          initialAccessTokenSecretRef:
            name: ""
            key: ""
    # authorization groups the coarse authorization knobs.
    authorization:
      # policyDataSource selects who authors the authorization policy data:
      # "automated" (operator projects data, default) or "manual" (admin authors
      # data).
      policyDataSource: ""
      # policyRegoOverride, when true, has the operator own only the policy.rego
      # key and leaves the data key to the admin. Orthogonal to policyDataSource.
      policyRegoOverride: false
    # extAuthzUrl overrides the PDP's ext_authz gRPC backend. When empty and the
    # PDP is enabled, the chart uses kaos-pdp.<release-namespace>.svc:9191.
    # Example: opa-envoy.opa-system.svc.cluster.local:9191
    extAuthzUrl: ""
    # issuer is the selected OIDC or AIB issuer URL. For AIB this exact value
    # must also configure broker.server.enduser.publicUrl; the KAOS CLI derives
    # both installs from this single value.
    issuer: ""
    # credentialSecretPrefix is the name prefix of the per-agent credential
    # Secret provisioned by the operator's identity projection. When set (and
    # extAuthzUrl is set), the operator mounts the matching Secret into each
    # agent pod as the AGENT_AUTH_CLIENT_ID/AGENT_AUTH_CLIENT_SECRET environment
    # variables. OIDC defaults to kaos-oidc; empty disables AIB credential
    # mounting. Example: kaos-aib
    credentialSecretPrefix: ""
    # adminUrl is the base URL of the identity broker admin API. When set, the
    # operator's identity projection controller registers agents and manages
    # their per-agent credential Secrets. Leaving it empty disables AIB identity
    # projection. Example:
    # http://aib-agentic-identity-broker.aib-system.svc.cluster.local:8000/api
    adminUrl: ""
    # adminPrincipal is the principal the projection controller presents to the
    # broker admin API (via adminPrincipalHeader). Defaults to kaos-operator.
    adminPrincipal: "kaos-operator"
    # adminPrincipalHeader is the header carrying the admin principal identity.
    adminPrincipalHeader: "X-Remote-User"
    # projection tunes the identity projection controller behavior.
    projection:
      # namespaces optionally restricts projection to a comma-separated list of
      # namespaces. Empty projects across all namespaces.
      namespaces: ""
      # prune removes broker agent records that no longer correspond to a KAOS
      # Agent. On by default.
      prune: true
      # policyConfigMap names the ConfigMap the operator writes with the
      # authorization policy and projected grant data for the PDP
      # to mount. When name and namespace are both set, the operator maintains
      # it; leaving either empty disables policy projection.
      policyConfigMap:
        name: ""
        namespace: ""
  # userAuth configures the human user identity provider (e.g. Keycloak) whose
  # subject tokens are verified at the gateway alongside agent actor tokens. When
  # issuer is unset, no user jwt provider is generated (agent-only/autonomous
  # installs); the block is independent of agentAuth.
  userAuth:
    # issuer is the user-auth OIDC issuer URL. Example:
    # http://keycloak.kaos-system.svc.cluster.local:8080/realms/kaos
    issuer: ""
    # audience is the expected audience claim for user subject tokens.
    # Example: kaos
    audience: ""
    # jwksUri optionally overrides the user provider's JWKS endpoint. When empty
    # it is derived from the issuer using the standard OIDC realm path
    # (<issuer>/protocol/openid-connect/certs).
    jwksUri: ""
  # gatewayNamespace is the namespace of the Envoy Gateway data plane. It is the
  # ingress source allowed by generated NetworkPolicies so the gateway can reach
  # protected workloads.
  gatewayNamespace: "envoy-gateway-system"
  # gatewayHost is the in-cluster host[:port] of the Envoy Gateway used when
  # gatewayRouting is enabled. When empty, the operator resolves it from the
  # Gateway resource's status address.
  gatewayHost: ""
  # networkPolicy denies direct workload-to-workload traffic so the gateway
  # cannot be bypassed. It only takes effect when security is operational
  # (agentAuth.extAuthzUrl set) and the cluster CNI enforces NetworkPolicy.
  networkPolicy:
    enabled: true
    # egress adds default-deny egress rules to generated NetworkPolicies. It is
    # off by default because provider-facing egress must be enabled deliberately.
    egress:
      enabled: false
  # gatewayRouting injects gateway-routed endpoint URLs into agents so internal
  # agent->ModelAPI/MCP/peer traffic flows through the gateway (where jwt_authn,
  # ext_authz applies) rather than directly to the workload Service.
  # Off by default; enable together with networkPolicy to make the gateway the
  # only application path between workloads.
  gatewayRouting:
    enabled: false
  # strictGatewayApi turns on gateway-only strict traffic: it enables
  # NetworkPolicy isolation and gateway-routed URLs together, independently of
  # whether the authorization enforcement hook (extAuthzUrl) is set.
  # Use it to make the Envoy Gateway the only application path between workloads
  # as a standalone posture. It overrides the networkPolicy.enabled escape hatch.
  # Enforcement of the generated NetworkPolicy still requires a CNI that enforces
  # it (e.g. Calico; the default kindnet does not). Off by default.
  strictGatewayApi:
    enabled: false
  # tls configures HTTPS termination on the Gateway's external boundary. When
  # mode is empty, only the HTTP listener is created and behavior is unchanged.
  tls:
    # mode selects how the serving certificate is provided:
    #   ""           - disabled (HTTP only)
    #   selfSigned   - the chart generates a self-signed kubernetes.io/tls Secret
    #   certManager  - the chart creates a cert-manager Certificate (issuerRef below)
    #   provided     - reference an existing kubernetes.io/tls Secret (secretName below)
    mode: ""
    # minVersion is enforced through an Envoy Gateway ClientTrafficPolicy when
    # HTTPS termination is enabled.
    minVersion: "1.2"
    certManager:
      issuerRef:
        # name of the cert-manager Issuer/ClusterIssuer (mode=certManager).
        name: ""
        # kind is Issuer or ClusterIssuer.
        kind: ClusterIssuer
    # secretName is the existing kubernetes.io/tls Secret to use (mode=provided).
    secretName: ""
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""

# Global telemetry configuration (applies to all components)
# Component-level telemetry config overrides these defaults
telemetry:
  # enabled controls whether telemetry is enabled by default for all components
  enabled: false
  # endpoint is the OTLP endpoint URL (required when enabled)
  # Example: "http://otel-collector.observability:4317"
  endpoint: ""

# Global log level for all components (control plane and data plane)
# Supported values: TRACE, DEBUG, INFO, WARNING, ERROR
# - Control plane (operator): Uses Go slog levels
# - Data plane (Agent, MCPServer): Uses Python logging levels
# - ModelAPI (LiteLLM): Maps to LITELLM_LOG
# - ModelAPI (Ollama): Maps to OLLAMA_DEBUG
logLevel: INFO
