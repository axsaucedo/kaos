# Kustomization for kaos-kubernetes-operator samples
# These are example configurations, apply individually:
#   kubectl apply -f 1-simple-echo-agent.yaml
#   kubectl apply -f 2-multi-agent-mcp.yaml
#   kubectl apply -f 3-hierarchical-agents.yaml
#   kubectl apply -f 4-dev-ollama-proxy-agent.yaml
#   kubectl apply -f 6-autonomous-monitor.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- 1-simple-echo-agent.yaml
- 2-multi-agent-mcp.yaml
- 3-hierarchical-agents.yaml
- 4-dev-ollama-proxy-agent.yaml
- 5-proxy-external-api.yaml
- 6-autonomous-monitor.yaml
- 7-memory-agent.yaml
- 8-access-grant.yaml
- 9-authorization-walkthrough.yaml
