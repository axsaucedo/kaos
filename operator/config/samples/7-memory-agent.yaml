---
# Sample 7: shared support memory with agents named by scope posture:
# user-assistant (personalised, user-scoped recall), session-assistant
# (conversation-only), and agent-bot (agent-isolated, no memory tools).
# Deploy: kaos samples deploy 7-memory-agent -n <namespace>
# Override the agent model with: kaos samples deploy 7-memory-agent --model <model>

apiVersion: kaos.tools/v1alpha1
kind: ModelAPI
metadata:
  name: support-modelapi
spec:
  mode: Proxy
  proxyConfig:
    models:
    - "*"
  container:
    env:
    - name: OPENAI_API_KEY
      value: "sk-placeholder"

---
apiVersion: kaos.tools/v1alpha1
kind: MemoryStore
metadata:
  name: support-memory
spec:
  engine: mem0
  storage:
    type: local
    local:
      provider: chroma
      persistentVolume:
        size: "1Gi"
  models:
    summarization:
      modelAPI: support-modelapi
      model: gpt-4o-mini
    embedding:
      modelAPI: support-modelapi
      model: text-embedding-3-small
  defaultFailureMode: soft
  shortTerm:
    tokenBudget: 64
  mediumTerm:
    enabled: true

---
apiVersion: kaos.tools/v1alpha1
kind: Agent
metadata:
  name: user-assistant
spec:
  modelAPI: support-modelapi
  model: gpt-4o-mini
  container:
    env:
    - name: DEBUG_MOCK_RESPONSES
      value: '["Noted — your favourite deployment port is 8080."]'
  config:
    description: Personalised assistant that recalls the user's facts on every turn
    instructions: Help users, drawing on their remembered preferences and entitled memory.
    memory:
      type: remote
      memoryStore: support-memory
      scope: user
      defaultReadScope: user
      readScopes:
      - session
      - agent
      - user
      - group
      tools: read
      clientParams:
        tokenBudget: 64
        rollingSummary: true

---
apiVersion: kaos.tools/v1alpha1
kind: Agent
metadata:
  name: session-assistant
spec:
  modelAPI: support-modelapi
  model: gpt-4o-mini
  config:
    description: Conversation-only assistant limited to the current session's memory
    instructions: Help users using only the current conversation's memory.
    memory:
      type: remote
      memoryStore: support-memory
      scope: session
      tools: read
      clientParams:
        tokenBudget: 64
        rollingSummary: true

---
apiVersion: kaos.tools/v1alpha1
kind: Agent
metadata:
  name: agent-bot
spec:
  modelAPI: support-modelapi
  model: gpt-4o-mini
  config:
    description: Agent-isolated bot without explicit memory tools
    instructions: Answer independently without explicit memory searches.
    memory:
      type: remote
      memoryStore: support-memory
      scope: agent
      clientParams:
        tokenBudget: 64
        rollingSummary: true
