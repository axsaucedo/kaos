---
# Sample 5: Agent with External API Provider
# Uses a Proxy ModelAPI with an external LLM provider (e.g., Nebius, OpenAI)
# Deploy: kaos samples deploy 5-proxy-external-api -n <namespace>
#
# IMPORTANT:
# Create the API key secret before deploying:
# kubectl create secret generic api-secrets \
#     -n <namespace> \
#     --from-literal "api-key=$API_KEY"

---
# ModelAPI: Proxy to external provider with API key
apiVersion: kaos.tools/v1alpha1
kind: ModelAPI
metadata:
  name: external-modelapi
spec:
  mode: Proxy
  proxyConfig:
    models:
    - "*"
    provider: nebius
    apiKey:
      valueFrom:
        secretKeyRef:
          name: api-secrets
          key: api-key

---
# MCPServer: Calculator tool
apiVersion: kaos.tools/v1alpha1
kind: MCPServer
metadata:
  name: external-calc-mcp
spec:
  runtime: python-string
  params: |
    def calculate(expression: str) -> str:
        """Evaluate a mathematical expression safely."""
        try:
            allowed = set('0123456789+-*/.() ')
            if not all(c in allowed for c in expression):
                return "Error: Invalid characters in expression"
            result = eval(expression)
            return str(result)
        except Exception as e:
            return f"Error: {str(e)}"

---
# Agent: Single agent with external API and calculator tool
apiVersion: kaos.tools/v1alpha1
kind: Agent
metadata:
  name: external-agent
spec:
  modelAPI: external-modelapi
  model: deepseek-ai/DeepSeek-V3-0324-fast
  mcpServers:
  - external-calc-mcp
  config:
    description: "Agent using external LLM provider with calculator tool"
    instructions: |
      You are a helpful assistant with access to a calculator tool.
      Use the calculator for any mathematical computations.
    reasoningLoopMaxSteps: 5
  agentNetwork:
    expose: true
