---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: memorystores.kaos.tools
spec:
  group: kaos.tools
  names:
    kind: MemoryStore
    listKind: MemoryStoreList
    plural: memorystores
    shortNames:
    - memstore
    - memstores
    singular: memorystore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .spec.storage.type
      name: Storage
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MemoryStore is the Schema for the memorystores API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MemoryStoreSpec defines the desired state of MemoryStore. It carries only
              infrastructure, model bindings, and the two store-level operational knobs; the
              short-term-window, digest, and sweeper marks are memory-service defaults.
            properties:
              defaultFailureMode:
                default: soft
                description: DefaultFailureMode is the store-wide default for the
                  write/forget path.
                enum:
                - soft
                - strict
                type: string
              engine:
                default: mem0
                description: Engine is the long-term memory engine. Mem0 is the only
                  supported engine today.
                enum:
                - mem0
                type: string
              extraction:
                description: Extraction tunes the long-term extraction executor.
                properties:
                  concurrency:
                    default: 4
                    description: Concurrency is the size of the Mem0 extraction executor
                      pool.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              models:
                description: Models binds the summarization and embedding model roles
                  to existing ModelAPIs.
                properties:
                  embedding:
                    description: Embedding drives vector embedding for long-term recall.
                    properties:
                      model:
                        description: Model is the model identifier the ModelAPI serves.
                        type: string
                      modelAPI:
                        description: ModelAPI is the name of a ModelAPI resource in
                          the same namespace.
                        type: string
                    required:
                    - model
                    - modelAPI
                    type: object
                  summarization:
                    description: Summarization drives Mem0's long-term extraction
                      prompt and the medium-term rolling digest.
                    properties:
                      model:
                        description: Model is the model identifier the ModelAPI serves.
                        type: string
                      modelAPI:
                        description: ModelAPI is the name of a ModelAPI resource in
                          the same namespace.
                        type: string
                    required:
                    - model
                    - modelAPI
                    type: object
                required:
                - embedding
                - summarization
                type: object
              replicas:
                default: 1
                description: Replicas is the number of memory-service replicas. Must
                  be 1 in local mode.
                format: int32
                minimum: 1
                type: integer
              storage:
                description: Storage selects and configures the storage backend.
                properties:
                  external:
                    description: External configures the external pgvector mode.
                    properties:
                      connectionSecretRef:
                        description: ConnectionSecretRef references the Secret key
                          holding the database DSN.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      embeddingDims:
                        default: 1536
                        description: EmbeddingDims is the embedding vector dimensionality
                          for the pgvector column.
                        format: int32
                        minimum: 1
                        type: integer
                      provider:
                        default: pgvector
                        description: Provider is the external vector store implementation.
                        enum:
                        - pgvector
                        type: string
                    required:
                    - connectionSecretRef
                    type: object
                  local:
                    description: |-
                      Local configures the single-container local mode. When omitted in local
                      mode the provider and persistent-volume size fall back to their defaults.
                    properties:
                      persistentVolume:
                        description: PersistentVolume sizes the PVC that backs Chroma
                          and the SQLite short-term window.
                        properties:
                          size:
                            default: 5Gi
                            description: Size is the requested storage size (e.g.
                              "5Gi").
                            type: string
                        type: object
                      provider:
                        default: chroma
                        description: |-
                          Provider is the local vector store implementation. Chroma is the only
                          supported provider because it pre-filters on scope for correct multi-tenant recall.
                        enum:
                        - chroma
                        type: string
                    type: object
                  type:
                    description: Type selects the storage mode.
                    enum:
                    - local
                    - external
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: storage.external is required when storage.type is external
                  rule: self.type != 'external' || has(self.external)
            required:
            - models
            - storage
            type: object
            x-kubernetes-validations:
            - message: replicas must be 1 in local storage mode
              rule: self.storage.type != 'local' || !has(self.replicas) || self.replicas
                == 1
          status:
            description: MemoryStoreStatus defines the observed state of MemoryStore.
            properties:
              deployment:
                description: Deployment contains status information from the underlying
                  Deployment.
                properties:
                  availableReplicas:
                    description: AvailableReplicas is the number of pods that are
                      available (ready for minReadySeconds).
                    format: int32
                    type: integer
                  conditions:
                    description: |-
                      Conditions represent the latest available observations of the deployment's state.
                      Typical conditions include Available, Progressing, and ReplicaFailure.
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                  readyReplicas:
                    description: ReadyReplicas is the number of pods with a Ready
                      condition.
                    format: int32
                    type: integer
                  replicas:
                    description: Replicas is the total number of non-terminated pods
                      targeted by this deployment.
                    format: int32
                    type: integer
                  updatedReplicas:
                    description: |-
                      UpdatedReplicas is the number of pods with the desired pod template spec.
                      During a rolling update, this shows progress toward the new version.
                    format: int32
                    type: integer
                type: object
              endpoint:
                description: Endpoint is the in-cluster service endpoint for the memory
                  service.
                type: string
              message:
                description: Message provides additional status information.
                type: string
              phase:
                description: Phase of the deployment.
                enum:
                - Pending
                - Ready
                - Failed
                type: string
              ready:
                description: Ready indicates if the memory service is ready.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
