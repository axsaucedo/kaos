[project]
name = "kaos-memory-service"
version = "0.4.8.dev0"
description = "KAOS memory service - long-term and working memory stores for Kubernetes agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "mem0ai==2.0.10",
    "chromadb>=1.5.0",
    "psycopg[pool]>=3.1.0",
    "pgvector>=0.2.0",
    "tiktoken>=0.7.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaos_memory"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
markers = [
    "pgvector: tests that require a local pgvector/Postgres container",
]

# Deprecation notices from upstream libraries are informational and must not
# fail type checking; library migrations are handled as deliberate changes.
[tool.ty.rules]
deprecated = "ignore"
