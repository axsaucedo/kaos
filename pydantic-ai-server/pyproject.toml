[project]
name = "pydantic-ai-server"
version = "0.7.5.dev0"
description = "PAIS - Pydantic AI Server for Kubernetes Agent Orchestration"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=2.0.0,<3.0.0",
    "kaos-memory[pydantic-ai]>=0.4.8.dev0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "sse-starlette>=1.6.0",
    "typer>=0.9.0",
    # OpenTelemetry core
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    # OpenTelemetry instrumentation
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
    "opentelemetry-instrumentation-starlette>=0.41b0",
    # OpenTelemetry exporters
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.scripts]
pais = "pais.cli:app"

[project.optional-dependencies]
cli = ["kaos-cli"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "python-dotenv>=1.0.0",
    "test-mcp-echo-server>=0.1.0",
    "black>=24.0.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Resolve the shared memory library from the sibling checkout for local dev, CI
# and the container build (WORKDIR /app -> ../kaos-memory == /kaos-memory). The
# published wheel's metadata still depends on kaos-memory from PyPI; hatchling
# ignores this uv-only source table at build time.
[tool.uv.sources]
kaos-memory = { path = "../kaos-memory", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["pais", "kaos_identity"]

[tool.black]
line-length = 100
target-version = ["py312"]

# Deprecation notices from upstream libraries are informational and must not
# fail type checking; library migrations are handled as deliberate changes.
[tool.ty.rules]
deprecated = "ignore"
unused-ignore-comment = "ignore"
