[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-cli"
version = "0.7.4.dev0"
description = "CLI for KAOS (K8s Agent Orchestration System)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "kubernetes>=29.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
kaos = "kaos_cli.main:app"

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.setuptools.package-data]
"kaos_cli.samples" = ["data/*.yaml"]
