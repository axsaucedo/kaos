# Default values for the KAOS sync service.

# Number of sync service replicas. A single replica is sufficient: reconcile is
# idempotent and ordering across replicas is not required.
replicaCount: 1

image:
  repository: axsauze/kaos-sync
  tag: ""  # defaults to chart appVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Broker admin API configuration.
broker:
  # adminUrl is the base URL of the broker admin API (including the /api suffix).
  adminUrl: "http://aib-admin.aib-system.svc.cluster.local:14000/api"
  # principal is the pre-authenticated principal sent to the admin API.
  principal: "kaos-sync"
  # principalHeader carries the pre-authenticated principal.
  principalHeader: "X-Remote-User"

sync:
  # Namespaces to reconcile. Empty means cluster-wide.
  namespaces: []
  # Prefix for the per-agent credential Secret names. Must match the operator's
  # security.agentAuth.credentialSecretPrefix so mounted credentials resolve.
  credentialSecretPrefix: "kaos-aib"
  # Safety-net resync interval (Go duration). A full reconcile also runs on every
  # KAOS resource change; this bounds drift when no events occur.
  reconcileInterval: "30s"
  # Per-request timeout to the broker admin API (Go duration).
  requestTimeout: "10s"
  # Delete orphaned broker records and credential Secrets no longer in the desired state.
  pruneEnabled: true
  # Lease-based leader election so the service can run as an HA Deployment.
  leaderElection: true

# Container ports. Health backs the /healthz and /readyz probes; metrics serves
# the controller-runtime Prometheus endpoint.
ports:
  health: 8081
  metrics: 8080

resources: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
